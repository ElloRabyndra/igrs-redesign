name: Lint Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'fe/**'
      - 'be/**'
      - '.github/workflows/lint.yml'

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'fe/package-lock.json'

      - name: Install dependencies
        working-directory: fe
        run: npm install

      - name: Run ESLint
        working-directory: fe
        run: npm run lint

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'be/package-lock.json'

      - name: Install dependencies
        working-directory: be
        run: npm install

      - name: Run ESLint
        working-directory: be
        run: npm run lint
